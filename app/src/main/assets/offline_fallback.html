<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>雯雯做题 · 离线</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f6f8f5;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;box-sizing:border-box;text-align:center;}
  .emoji{font-size:52px;line-height:1;}
  h1{font-size:19px;color:#2e3d2a;margin:16px 0 8px;}
  p{font-size:14px;color:#6b7a67;margin:4px 0;line-height:1.7;}
  .card{background:#fff;border:1px solid #dfe8df;border-radius:14px;padding:22px 18px;max-width:420px;width:100%;box-shadow:0 2px 10px rgba(40,60,40,.06);}
  .btn{display:inline-block;margin-top:18px;padding:11px 34px;font-size:16px;font-weight:bold;color:#fff;background:#2f7d4f;border:none;border-radius:9px;}
  .btn:active{background:#276a43;}
  .btn[disabled]{background:#9dbba8;}
  .tip{font-size:12px;color:#93a08f;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="emoji">📴</div>
    <h1>现在连不上家里的电脑</h1>
    <p>之前缓存过的做题页面通常仍能离线使用；</p>
    <p>如果做题页面也打不开，可以先歇一会儿，</p>
    <p>回到家里连上 WiFi 后会自动恢复。</p>
    <button class="btn" id="retryBtn" onclick="doRetry()">🔄 重试连接</button>
    <div class="tip">做过的题都存本机，一条也不会丢</div>
  </div>
</div>
<script>
function doRetry(){
  var b=document.getElementById('retryBtn');
  b.disabled=true;b.textContent='正在尝试连接…';
  try{
    if(window.WenwenBridge&&window.WenwenBridge.retry){window.WenwenBridge.retry();return;}
  }catch(e){}
  b.disabled=false;b.textContent='🔄 重试连接';
}
</script>
</body>
</html>
