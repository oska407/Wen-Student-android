plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenwen.student'
    compileSdk 34

    defaultConfig {
        applicationId "com.wenwen.student"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    // 扫码：CameraX 取画面 + ZXing 解码
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    implementation "com.google.zxing:core:3.5.3"
}

// Kotlin 1.8 起 kotlin-stdlib-jdk7/jdk8 已并入主库，旧版(1.6.0)会带来重复类；
// 统一重定向到主库，消除 checkDebugDuplicateClasses 冲突。
configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
        substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')
    }
}
